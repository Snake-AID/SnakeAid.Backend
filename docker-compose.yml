services:
  snakeaid-api:
    container_name: snakeaid-api
    image: thekhiem7/snakeaid-api:latest
    pull_policy: always
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    ports:
      - "5110:8080"
    environment:
      - DOPPLER_TOKEN=
      - DOPPLER_CONFIG=snake-aid/dev
    restart: unless-stopped