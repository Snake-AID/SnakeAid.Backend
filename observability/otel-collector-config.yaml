receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:

exporters:
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "snakeaid_api"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp] # To Tempo (via OTLP)
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus] # Expose via Prometheus scrape endpoint
